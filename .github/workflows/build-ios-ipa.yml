name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "mobile/**"
      - "content*.js"
      - "content.css"
      - "license.js"
      - "popup.*"
      - "options.*"
      - "stats.*"
      - "manifest.json"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ios-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Biên dịch và đóng gói FUNNYGAME.ipa (Xcode + Safari Extension)
        run: |
          chmod +x ios/build-ipa.sh
          ./ios/build-ipa.sh

      - name: Tải lên Artifact FUNNYGAME-iOS.ipa
        uses: actions/upload-artifact@v4
        with:
          name: FUNNYGAME-iOS-IPA
          path: |
            release/funnygame-ios.ipa
            dist/funnygame-ios-v*.ipa
          retention-days: 90

      # IPA được đăng lên GitHub Releases (tag cố định "ios-latest") thay vì commit vào kho mã nguồn:
      # không còn commit tự động bởi bot, repo không phình dần vì file nhị phân.
      # Link tải cố định: https://github.com/<owner>/<repo>/releases/download/ios-latest/funnygame-ios.ipa
      - name: Đăng IPA lên GitHub Releases (ios-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp release/funnygame-ios.ipa "funnygame-ios-v${VERSION}.ipa"
          gh release delete ios-latest --cleanup-tag --yes || true
          gh release create ios-latest \
            release/funnygame-ios.ipa "funnygame-ios-v${VERSION}.ipa" \
            --target "${{ github.sha }}" \
            --title "FUNNYGAME iOS v${VERSION} (bản mới nhất)" \
            --notes "Bản build tự động từ commit ${{ github.sha }}. Tải funnygame-ios.ipa rồi cài bằng Sideloadly / AltStore (xem mobile/IOS-INSTALL.md)." \
            --prerelease
