<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="movie_player" class="html5-video-player" style="width:640px;height:360px">
  <video class="html5-main-video" style="width:640px;height:360px"></video>
  <div class="video-ads ytp-ad-module"></div>
</div>
<div id="shorts-player" class="html5-video-player" style="width:300px;height:500px">
  <video class="html5-main-video" style="width:300px;height:500px"></video>
</div>
<pre id="out">RUNNING</pre>
<script>
// Giả lập media: duration/currentTime có thể điều khiển
function fakeMedia(v, dur) {
  let t = 0, d = dur;
  Object.defineProperty(v, "duration", { configurable: true, get: () => d, set: (x) => { d = x; } });
  Object.defineProperty(v, "currentTime", { configurable: true, get: () => t, set: (x) => { t = x; } });
  // Giả lập buffered: luôn buffer đến cuối (trình duyệt thật sẽ buffer theo mạng)
  Object.defineProperty(v, "buffered", { configurable: true, get: () => ({
    length: isFinite(d) && d > 0 ? 1 : 0,
    start: () => 0,
    end: () => d,
  }) });
  v.play = () => Promise.resolve();
}
const mp = document.getElementById("movie_player");
const sp = document.getElementById("shorts-player");
const v = mp.querySelector("video");
const sv = sp.querySelector("video");
fakeMedia(v, 30); fakeMedia(sv, 25);
mp.getPlaybackRate = () => 1;
window.__FG_TEST__ = {};
</script>
<script src="/content-yt-net.js"></script>
<script src="/content-main.js"></script>
<script>
const results = [];
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
window.addEventListener("error", (e) => { results.push("FAIL runtime error: " + e.message + " @" + e.lineno); document.getElementById("out").textContent = results.join("\n"); });
window.addEventListener("unhandledrejection", (e) => { results.push("FAIL unhandled rejection: " + (e.reason && e.reason.message || e.reason)); document.getElementById("out").textContent = results.join("\n"); });
function check(name, cond, extra) { results.push((cond ? "PASS " : "FAIL ") + name + (extra ? "  [" + extra + "]" : "")); }
function addBadge(p) { const b = document.createElement("div"); b.className = "ytp-ad-badge"; b.style.cssText = "width:40px;height:20px"; b.textContent = "Ad"; p.appendChild(b); return b; }

(async () => {
 try {
  window.postMessage({ type: "FG_LICENSE", ok: true, settings: { blockVideo: true, muteAds: true, fastSkip: true }, whitelisted: false }, "*");
  await sleep(400);

  // 1. Video thường
  v.currentTime = 5;
  await sleep(800);
  check("1 video thuong khong bi dong", v.playbackRate === 1 && !v.muted && v.currentTime === 5, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);

  // 2. Class ad-showing SÓT nhưng không có UI QC (nguyên nhân auto tua cũ), video ngắn
  mp.classList.add("ad-showing");
  v.duration = 45; v.currentTime = 3;
  await sleep(800);
  check("2 class ad-showing sot -> khong tua", v.playbackRate === 1 && !v.muted && v.currentTime === 3, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);

  // 3. Badge QC còn sót nhưng KHÔNG có class ad-showing
  mp.classList.remove("ad-showing");
  const stale = addBadge(mp);
  await sleep(800);
  check("3 badge sot khong co class -> khong tua", v.playbackRate === 1 && v.currentTime === 3, `rate=${v.playbackRate} t=${v.currentTime}`);
  stale.remove();

  // 4. QC thật
  v.duration = 15; v.currentTime = 1;
  mp.classList.add("ad-showing");
  const badge = addBadge(mp);
  await sleep(500);
  check("4 QC that -> mute + 16x + tua cuoi", v.muted && v.playbackRate === 16 && v.currentTime >= 14.8, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);

  // 5. Hết QC -> khôi phục
  mp.classList.remove("ad-showing"); badge.remove();
  v.duration = 600; v.currentTime = 0;
  await sleep(700);
  check("5 het QC -> khoi phuc 1x, bo mute, khong tua video chinh", v.playbackRate === 1 && !v.muted && v.currentTime === 0, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);

  // 6. Người dùng đã mute từ trước -> giữ nguyên mute sau QC
  v.muted = true;
  v.duration = 10; v.currentTime = 1;
  mp.classList.add("ad-showing"); const b2 = addBadge(mp);
  await sleep(500);
  mp.classList.remove("ad-showing"); b2.remove();
  v.duration = 300; v.currentTime = 0;
  await sleep(700);
  check("6 user tu mute -> van mute sau QC", v.muted === true && v.playbackRate === 1, `rate=${v.playbackRate} muted=${v.muted}`);
  v.muted = false;

  // 7. Người dùng xem 1.5x -> sau QC trở lại 1.5x
  mp.getPlaybackRate = () => 1.5; v.playbackRate = 1.5;
  v.duration = 10; v.currentTime = 1;
  mp.classList.add("ad-showing"); const b3 = addBadge(mp);
  await sleep(500);
  mp.classList.remove("ad-showing"); b3.remove();
  v.duration = 300; v.currentTime = 0;
  await sleep(700);
  check("7 toc do 1.5x cua user duoc giu", v.playbackRate === 1.5, `rate=${v.playbackRate}`);
  mp.getPlaybackRate = () => 1; v.playbackRate = 1;

  // 8. Watchdog: video chính kẹt 16x không có QC
  v.playbackRate = 16;
  await sleep(700);
  check("8 watchdog go ket 16x", v.playbackRate === 1, `rate=${v.playbackRate}`);

  // 9. Nút Skip hiện -> được bấm, không tua
  let clicked = 0;
  v.duration = 20; v.currentTime = 2;
  mp.classList.add("ad-showing");
  const skip = document.createElement("button"); skip.className = "ytp-skip-ad-button"; skip.style.cssText = "width:80px;height:30px"; skip.onclick = () => clicked++;
  mp.appendChild(skip);
  await sleep(500);
  check("9 bam nut Skip", clicked > 0, `clicked=${clicked}`);
  mp.classList.remove("ad-showing"); skip.remove();
  await sleep(500);

  // 10. Shorts: QC trong shorts-player
  sv.duration = 12; sv.currentTime = 1;
  sp.classList.add("ad-showing"); const b4 = addBadge(sp);
  await sleep(500);
  check("10 Shorts QC xu ly", sv.muted && sv.playbackRate === 16, `rate=${sv.playbackRate} muted=${sv.muted}`);
  sp.classList.remove("ad-showing"); b4.remove();
  await sleep(600);
  check("10b Shorts khoi phuc", sv.playbackRate === 1 && !sv.muted, `rate=${sv.playbackRate} muted=${sv.muted}`);

  // 11. Shorts thường (không QC) không bị đụng
  sv.duration = 40; sv.currentTime = 4;
  await sleep(600);
  check("11 Shorts thuong khong bi tua", sv.playbackRate === 1 && sv.currentTime === 4, `rate=${sv.playbackRate} t=${sv.currentTime}`);

  // 12. Tắt blockVideo -> không đụng QC
  window.postMessage({ type: "FG_LICENSE", ok: true, settings: { blockVideo: false }, whitelisted: false }, "*");
  await sleep(200);
  v.duration = 15; v.currentTime = 1;
  mp.classList.add("ad-showing"); const b5 = addBadge(mp);
  await sleep(500);
  check("12 tat blockVideo -> khong dong", v.playbackRate === 1 && !v.muted && v.currentTime === 1, `rate=${v.playbackRate} t=${v.currentTime}`);
  mp.classList.remove("ad-showing"); b5.remove();

  // 13. Whitelist kênh
  window.postMessage({ type: "FG_LICENSE", ok: true, settings: { blockVideo: true }, whitelisted: true }, "*");
  await sleep(200);
  mp.classList.add("ad-showing"); const b6 = addBadge(mp);
  await sleep(500);
  check("13 kenh whitelist -> khong dong", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate}`);
  mp.classList.remove("ad-showing"); b6.remove();

  // 14. Không có license
  window.postMessage({ type: "FG_LICENSE", ok: false, settings: {}, whitelisted: false }, "*");
  await sleep(200);
  mp.classList.add("ad-showing"); const b7 = addBadge(mp);
  await sleep(500);
  check("14 chua kich hoat -> khong dong", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate}`);
  mp.classList.remove("ad-showing"); b7.remove();

  // Bật lại
  window.postMessage({ type: "FG_LICENSE", ok: true, settings: { blockVideo: true, muteAds: true, fastSkip: true }, whitelisted: false }, "*");
  await sleep(400);
  let counts = 0;
  window.addEventListener("message", (e) => { if (e.data && e.data.type === "FG_COUNT" && e.data.category === "video") counts++; });

  // 15. Chuỗi 2 QC: UI QC biến mất 300ms giữa 2 QC nhưng class còn -> giữ 16x, đếm 1 lần
  v.duration = 15; v.currentTime = 1;
  mp.classList.add("ad-showing"); let pb = addBadge(mp);
  await sleep(400);
  pb.remove();
  await sleep(300);
  const midRate = v.playbackRate, midMuted = v.muted;
  pb = addBadge(mp); v.duration = 12; v.currentTime = 1;
  await sleep(400);
  check("15 chuoi QC: khong bat tieng/1x chop nhoang giua 2 QC", midRate === 16 && midMuted === true && v.playbackRate === 16, `mid=${midRate}/${midMuted}`);
  check("15b chuoi QC chi dem 1 lan", counts === 1, `counts=${counts}`);
  mp.classList.remove("ad-showing"); pb.remove();
  v.duration = 500; v.currentTime = 0;
  await sleep(600);
  check("15c het chuoi QC -> khoi phuc", v.playbackRate === 1 && !v.muted && v.currentTime === 0, `rate=${v.playbackRate} muted=${v.muted}`);

  // 16. Đang QC thì UI mất nhưng class sót mãi -> khôi phục sau ~700ms, không tua video chính
  v.duration = 15; v.currentTime = 1;
  mp.classList.add("ad-showing"); const b8 = addBadge(mp);
  await sleep(400);
  b8.remove(); v.duration = 900; v.currentTime = 10;
  await sleep(1200);
  check("16 class sot sau QC -> van khoi phuc, khong tua", v.playbackRate === 1 && !v.muted && v.currentTime === 10, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);
  mp.classList.remove("ad-showing");

  // 16b. Trang thật: thanh tiến trình LUÔN có .ytp-ad-progress-list → class ad-showing sót không được coi là QC
  const pbc = document.createElement("div"); pbc.className = "ytp-progress-bar-container"; pbc.style.cssText = "width:600px;height:5px";
  const apl = document.createElement("div"); apl.className = "ytp-ad-progress-list"; apl.style.cssText = "width:600px;height:5px";
  const adp = document.createElement("div"); adp.className = "ytp-ad-progress"; adp.style.cssText = "width:4px;height:5px";
  apl.appendChild(adp); pbc.appendChild(apl); mp.appendChild(pbc);
  v.duration = 45; v.currentTime = 7; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(800);
  check("16b ad-showing sot + thanh tien trinh (ytp-ad-progress-list) -> KHONG tua", v.playbackRate === 1 && !v.muted && v.currentTime === 7, `rate=${v.playbackRate} t=${v.currentTime}`);
  mp.classList.remove("ad-showing");
  await sleep(300);

  // 17. Màn hình cuối QC kiểu mới (tên class lạ, nút "Bỏ qua" tên lạ)
  let endSkip = 0, wrongClick = 0;
  const chapterSkip = document.createElement("button"); chapterSkip.className = "ytp-chapter-skip"; chapterSkip.textContent = "Bỏ qua"; chapterSkip.style.cssText = "width:60px;height:24px"; chapterSkip.onclick = () => wrongClick++;
  mp.appendChild(chapterSkip); // nút "Bỏ qua" KHÔNG thuộc vùng QC
  await sleep(500);
  check("17a nut 'Bo qua' ngoai vung QC, khong co QC -> khong bam", wrongClick === 0);
  const endcap = document.createElement("div"); endcap.className = "ytp-ad-endcap-layout-2027"; endcap.style.cssText = "width:400px;height:200px";
  const cta = document.createElement("div"); cta.textContent = "Chạy quảng cáo TikTok ngay"; endcap.appendChild(cta);
  const nb = document.createElement("button"); nb.className = "ytp-new-btn-xyz"; nb.innerHTML = "Bỏ qua <span>▶</span>"; nb.style.cssText = "width:80px;height:30px"; nb.onclick = () => endSkip++;
  endcap.appendChild(nb);
  mp.querySelector(".video-ads").appendChild(endcap);
  v.duration = 20; v.currentTime = 1;
  mp.classList.add("ad-showing");
  await sleep(600);
  check("17b man hinh cuoi QC kieu moi -> nhan dien la QC", v.playbackRate === 16 || endSkip > 0, `rate=${v.playbackRate} skip=${endSkip}`);
  check("17c bam nut 'Bo qua' ten moi trong vung QC", endSkip > 0, `clicked=${endSkip}`);
  check("17d khong bam nham nut 'Bo qua' ngoai vung QC", wrongClick === 0, `wrong=${wrongClick}`);
  mp.classList.remove("ad-showing"); endcap.remove(); chapterSkip.remove();
  v.duration = 400; v.currentTime = 0;
  await sleep(600);
  check("17e het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 17f. QC interstitial (ended-mode): nút skip có sẵn + video paused, duration=null → phải click skip VÀ play lại
  let interSkip = 0;
  const interBtn = document.createElement("button");
  interBtn.className = "ytp-skip-ad-button ytp-ad-component--clickable";
  interBtn.id = "skip-button-inter";
  interBtn.style.cssText = "width:100px;height:36px";
  interBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  interBtn.onclick = () => interSkip++;
  mp.querySelector(".video-ads").appendChild(interBtn);
  mp.classList.add("ad-showing");
  // Giả lập video QC ended (duration=null, paused=true)
  v.duration = NaN; v.currentTime = 0; v.playbackRate = 1; v.muted = false;
  v.__paused = true; // flag giả
  await sleep(600);
  check("17f QC interstitial: click nut skip khi co .ytp-skip-ad-button", interSkip > 0, `clicked=${interSkip}`);
  mp.classList.remove("ad-showing"); interBtn.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("17g het QC interstitial -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 17h. fireClick: nút skip chỉ lắng nghe mousedown (không lắng nghe click event) → phải dùng full event sequence
  let fireClicks = 0, onlyMousedown = 0;
  const fBtn = document.createElement("button");
  fBtn.className = "ytp-skip-ad-button";
  fBtn.style.cssText = "width:100px;height:36px";
  fBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  // Chỉ đếm mousedown (giống behavior YouTube interstitial thật)
  fBtn.addEventListener("mousedown", () => onlyMousedown++);
  fBtn.onclick = () => fireClicks++;
  mp.querySelector(".video-ads").appendChild(fBtn);
  mp.classList.add("ad-showing");
  v.duration = NaN; v.currentTime = 0; v.playbackRate = 1; v.muted = false;
  await sleep(600);
  check("17h fireClick gui ca mousedown va click event cho skip button", onlyMousedown > 0, `mousedown=${onlyMousedown} click=${fireClicks}`);
  mp.classList.remove("ad-showing"); fBtn.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(400);

  // 18. LỖI THẬT: player.cancelAd() tồn tại nhưng KHÔNG làm gì (YouTube im lặng bỏ qua).
  // Không được `return` sớm → phải còn fallback: bấm nút skip + mute + tua 16x.
  let cancelCalls = 0, noopSkip = 0;
  mp.cancelAd = () => { cancelCalls++; /* cố tình không làm gì */ };
  const noopBtn = document.createElement("button");
  noopBtn.className = "ytp-skip-ad-button";
  noopBtn.style.cssText = "width:100px;height:36px";
  noopBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  noopBtn.onclick = () => noopSkip++;
  mp.querySelector(".video-ads").appendChild(noopBtn);
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(1800);
  check("18a cancelAd() khong an -> van goi fallback (bam nut skip)", noopSkip > 0, `skip=${noopSkip} cancel=${cancelCalls}`);
  check("18b cancelAd() khong an -> van mute + tua 16x", v.muted === true && v.playbackRate === 16, `rate=${v.playbackRate} muted=${v.muted}`);
  mp.classList.remove("ad-showing"); noopBtn.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("18c het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);
  delete mp.cancelAd;

  // 19. Nút skip nằm trong .ytp-ad-overlay-container (bị CSS extension ẩn) → vẫn phải click được
  let hiddenSkip = 0;
  const ov = document.createElement("div");
  ov.className = "ytp-ad-overlay-container";
  const hBtn = document.createElement("button");
  hBtn.className = "ytp-ad-skip-button-slot";
  hBtn.style.cssText = "width:100px;height:36px";
  hBtn.innerHTML = '<div class="ytp-ad-skip-button__text">Bỏ qua</div>';
  hBtn.onclick = () => hiddenSkip++;
  ov.appendChild(hBtn);
  mp.querySelector(".video-ads").appendChild(ov);
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(600);
  check("19 nut skip bi an (overlay-container) -> van bam duoc", hiddenSkip > 0, `clicked=${hiddenSkip}`);
  mp.classList.remove("ad-showing"); ov.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("19b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 20. LỖI "CHROME ĐỨNG": click nút skip → YouTube đổi class → MutationObserver →
  // processPlayer → handleAd → click lại → vòng lặp microtask treo trình duyệt.
  // Phải bảo đảm: (1) không bấm lại CÙNG một phần tử trong 3s, (2) tổng số lần bấm có trần.
  let loopSkip = 0;
  const loopBtn = document.createElement("button");
  loopBtn.className = "ytp-skip-ad-button";
  loopBtn.style.cssText = "width:100px;height:36px";
  loopBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  loopBtn.onclick = () => { loopSkip++; mp.classList.remove("ad-showing"); mp.classList.add("ad-showing"); };
  mp.querySelector(".video-ads").appendChild(loopBtn);
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  // Đo độ trễ event loop: nếu vòng lặp microtask treo Chrome, timer sẽ bị trễ hàng trăm ms→vài giây
  let maxLag = 0, lagCount = 0;
  const t0 = Date.now();
  const probe = () => {
    const lag = Date.now() - t0;
    maxLag = Math.max(maxLag, lag - tick);
    tick = Date.now();
    lagCount++;
    if (lag < 3000) setTimeout(probe, 16);
  };
  let tick = Date.now();
  setTimeout(probe, 16);
  await sleep(3000);
  check("20a vong lap click khong treo trinh duyet (event loop responsive)", maxLag < 500, `maxLag=${maxLag}ms ticks=${lagCount}`);
  check("20b so lan click bi chan (khong spam)", loopSkip <= 3, `clicks=${loopSkip}`);
  mp.classList.remove("ad-showing"); loopBtn.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("20c het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 21. giveUp (dừng thao tác sau 12s) phải reset khi vào QC mới — không kẹt vĩnh viễn
  const gvBtn = document.createElement("button");
  gvBtn.className = "ytp-skip-ad-button";
  gvBtn.style.cssText = "width:100px;height:36px";
  gvBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  mp.querySelector(".video-ads").appendChild(gvBtn);
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(400);
  mp.classList.remove("ad-showing");
  await sleep(800);
  // QC thứ 2 ngay sau đó — phải vẫn được xử lý (không bị giveUp kẹt)
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(500);
  check("21 QC moi sau QC cuoi van duoc xu ly", v.playbackRate === 16 || v.muted === true, `rate=${v.playbackRate} muted=${v.muted}`);
  mp.classList.remove("ad-showing"); gvBtn.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("21b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 22. cancelAd() phải được gọi ĐÚNG MỘT LẦN cho mỗi QC.
  // Gọi lặp lại (mỗi 2s) khiến player YouTube re-init liên tục → Chrome đứng/đơ.
  let cc2 = 0;
  mp.cancelAd = () => { cc2++; };
  const ccBtn = document.createElement("button");
  ccBtn.className = "ytp-skip-ad-button";
  ccBtn.style.cssText = "width:100px;height:36px";
  ccBtn.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  mp.querySelector(".video-ads").appendChild(ccBtn);
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  await sleep(5000);
  check("22 cancelAd() chi goi MOT LAN cho 1 QC", cc2 <= 1, `calls=${cc2}`);
  mp.classList.remove("ad-showing"); ccBtn.remove();
  delete mp.cancelAd;
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(600);
  check("22b het QC -> khoi phuc", v.playbookRate === undefined && v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 23. QC bumper (YouTube 2025+): không gắn class ad-showing, chỉ có overlay + badge.
  const bumpOverlay = document.createElement("div");
  bumpOverlay.className = "ytp-ad-player-overlay-layer";
  bumpOverlay.style.cssText = "width:400px;height:200px";
  const bumpBadge = document.createElement("div");
  bumpBadge.className = "ytp-ad-simple-ad-badge";

  // 40. Nút "Bỏ qua" ăn ngay → QC kết thúc nhanh, KHÔNG seek tới cuối (giữ hành vi tự nhiên)
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge40 = addBadge(mp);
  const btn40 = document.createElement("button");
  btn40.className = "ytp-skip-ad-button";
  btn40.style.cssText = "width:100px;height:36px";
  btn40.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  let clicked40 = 0;
  btn40.onclick = () => { clicked40++; mp.classList.remove("ad-showing"); badge40.remove(); btn40.remove(); };
  mp.querySelector(".video-ads").appendChild(btn40);
  await sleep(900);
  check("40 nut skip an ngay -> QC ket thuc, da bam nut", clicked40 > 0, `clicks=${clicked40}`);
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("40b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 41. Nút "Bỏ qua" dạng <div> với class LẠ (YouTube đổi tên class) → vẫn phải bấm được
  // (Pass 3: tìm theo CHỮ trong mọi vùng QC)
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge41 = addBadge(mp);
  const btn41 = document.createElement("div");
  btn41.className = "ytp-ad-component--clickable zzz-unknown-class-2026";
  btn41.style.cssText = "width:110px;height:36px";
  btn41.textContent = "Bỏ qua quảng cáo";
  let clicked41 = 0;
  btn41.addEventListener("click", () => clicked41++);
  mp.querySelector(".video-ads").appendChild(btn41);
  await sleep(900);
  check("41 nut skip class la -> van tim thay qua text va bam duoc", clicked41 > 0, `clicks=${clicked41}`);
  mp.classList.remove("ad-showing"); badge41.remove(); btn41.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("41b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 42. Nút "Bỏ qua" nằm NGOÀI .video-ads, trong vùng interstitial → phải bấm được (Pass 3)
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge42 = addBadge(mp);
  let clicked42 = 0;
  const btn42 = document.createElement("div");
  btn42.className = "ytp-ad-component--clickable ytp-skip-ad-button";
  btn42.style.cssText = "width:110px;height:36px";
  btn42.textContent = "Bỏ qua";
  btn42.addEventListener("click", () => clicked42++);
  const inter42 = document.createElement("div");
  inter42.className = "ytp-video-interstitial-buttoned-centered-layout";
  inter42.style.cssText = "width:400px;height:200px";
  inter42.appendChild(btn42);
  mp.appendChild(inter42);
  await sleep(900);
  check("42 nut skip ngoai .video-ads (interstitial) -> bam duoc", clicked42 > 0, `clicks=${clicked42}`);
  mp.classList.remove("ad-showing"); badge42.remove(); inter42.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("42b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 43. QC dài KHÔNG có nút "Bỏ qua" + KHÔNG buffer tới cuối → phải seek tới cuối
  // (không phụ thuộc buffer) thay vì chạy 16x tới hết QC.
  v.duration = 60; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  // Ghi đè buffered: KHÔNG có gì buffer (mô phỏng mạng yếu — QC chưa tải hết)
  Object.defineProperty(v, "buffered", { configurable: true, get: () => ({ length: 0, start: () => 0, end: () => 0 }) });
  mp.classList.add("ad-showing");
  const badge43 = addBadge(mp);
  await sleep(2500);
  check("43 QC khong nut skip + khong buffer -> da seek toi cuoi", v.currentTime >= 59.8, `t=${v.currentTime}`);
  mp.classList.remove("ad-showing"); badge43.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("43b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);
  // Khôi phục buffered giả
  Object.defineProperty(v, "buffered", { configurable: true, get: () => ({
    length: isFinite(v.duration) && v.duration > 0 ? 1 : 0, start: () => 0, end: () => v.duration,
  }) });

  // 44. QC CÓ nút "Bỏ qua" → ưu tiên bấm nút, KHÔNG seek tới cuối ngay (để YouTube tự chuyển)
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge44 = addBadge(mp);
  const btn44 = document.createElement("button");
  btn44.className = "ytp-skip-ad-button";
  btn44.style.cssText = "width:100px;height:36px";
  btn44.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  let clicked44 = 0;
  btn44.onclick = () => clicked44++;   // KHÔNG kết thúc QC -> kiểm tra fallback hoạt động
  mp.querySelector(".video-ads").appendChild(btn44);
  await sleep(700);
  check("44 QC co nut skip -> da bam nut", clicked44 > 0, `clicks=${clicked44}`);
  mp.classList.remove("ad-showing"); badge44.remove(); btn44.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("44b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 45. REGRESSION (báo lỗi thật 2.4.12, video j8U06veqxdU):
  //     playerClass = "... ytp-transparent ... ad-created ytp-branding-shown
  //                    playing-mode buffering-mode unstarted-mode"
  //     → KHÔNG có "ad-showing"/"ad-interrupting" → hasAdClass() = false
  //     → trước đây isConfirmedAd() = false → KHÔNG xử lý QC → QC hiện ra cho người dùng.
  //     Nay phải nhận biết QC qua "ad-created" + UI QC hiển thị trong .video-ads.
  v.duration = 30; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.remove("ad-showing");
  mp.classList.add("ad-created");
  mp.classList.add("ytp-branding-shown");
  // Badge QC thực tế nằm TRONG .video-ads
  const badge45 = document.createElement("div");
  badge45.className = "ytp-ad-simple-ad-badge";
  badge45.style.cssText = "width:80px;height:20px";
  badge45.textContent = "Quảng cáo";
  mp.querySelector(".video-ads").appendChild(badge45);
  await sleep(2200);
  check("45 QC kieu moi (chi co ad-created, khong ad-showing) -> van duoc xu ly",
    v.playbackRate === 16 && v.muted === true, `rate=${v.playbackRate} muted=${v.muted}`);
  check("45b video QC duoc an (opacity 0) -> nguoi dung khong thay QC",
    v.style.opacity === "0", `opacity="${v.style.opacity}"`);
  mp.classList.remove("ad-created");
  mp.classList.remove("ytp-branding-shown");
  badge45.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(900);
  check("45c het QC -> khoi phuc", v.playbackRate === 1 && !v.muted && v.style.opacity !== "0",
    `rate=${v.playbackRate} muted=${v.muted} opacity="${v.style.opacity}"`);

  // 46. "ad-created" có mặt nhưng KHÔNG có UI QC nào hiển thị → KHÔNG được coi là QC
  // (tránh tua nhầm video chính — class "ad-created" được giữ lại sau khi QC kết thúc).
  v.duration = 400; v.currentTime = 7; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-created");
  mp.classList.add("ytp-branding-shown");
  await sleep(1200);
  check("46 ad-created nhung khong co UI QC -> KHONG tua video chinh",
    v.playbackRate === 1 && !v.muted && v.currentTime === 7, `rate=${v.playbackRate} muted=${v.muted} t=${v.currentTime}`);
  mp.classList.remove("ad-created");
  mp.classList.remove("ytp-branding-shown");
  await sleep(400);

  // 47. QC có nút "Bỏ qua" + chỉ có "ad-created" → phải BẤM được nút (đường nhận biết mới)
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-created");
  const badge47 = document.createElement("div");
  badge47.className = "ytp-ad-simple-ad-badge";
  badge47.style.cssText = "width:80px;height:20px";
  mp.querySelector(".video-ads").appendChild(badge47);
  let clicked47 = 0;
  const btn47 = document.createElement("div");
  btn47.className = "ytp-skip-ad-button ytp-ad-component--clickable";
  btn47.style.cssText = "width:100px;height:36px";
  btn47.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
  btn47.addEventListener("click", () => clicked47++);
  mp.querySelector(".video-ads").appendChild(btn47);
  await sleep(1200);
  check("47 QC kieu moi co nut Bo qua -> da bam duoc", clicked47 > 0, `clicks=${clicked47}`);
  mp.classList.remove("ad-created");
  badge47.remove(); btn47.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(900);
  check("47b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 48. Nút "Bỏ qua" xuất hiện MUỘN (sau khi QC đã chạy) → phải bấm được ngay
  // (MutationObserver theo dõi vùng UI QC, không chờ lượt quét 300ms).
  v.duration = 45; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-created");
  const badge48 = document.createElement("div");
  badge48.className = "ytp-ad-simple-ad-badge";
  badge48.style.cssText = "width:80px;height:20px";
  mp.querySelector(".video-ads").appendChild(badge48);
  await sleep(400);
  let clicked48 = 0;
  setTimeout(() => {
    const b48 = document.createElement("div");
    b48.className = "ytp-skip-ad-button ytp-ad-component--clickable";
    b48.style.cssText = "width:100px;height:36px";
    b48.innerHTML = '<div class="ytp-skip-ad-button__text">Bỏ qua</div>';
    b48.addEventListener("click", () => clicked48++);
    mp.querySelector(".video-ads").appendChild(b48);
  }, 300);
  await sleep(1200);
  check("48 nut skip xuat hien muon (QC kieu moi) -> bam duoc", clicked48 > 0, `clicks=${clicked48}`);
  mp.classList.remove("ad-created");
  badge48.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(900);
  check("48b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 49. QC kiểu mới: "ad-created" + "ytp-branding-shown" + overlay trong .video-ads
  // (KHÔNG có badge, KHÔNG có nút "Bỏ qua") → vẫn phải nhận biết được là QC.
  v.duration = 30; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-created");
  mp.classList.add("ytp-branding-shown");
  const ov49 = document.createElement("div");
  ov49.className = "ytp-ad-player-overlay-layer";
  ov49.style.cssText = "width:400px;height:200px";
  mp.querySelector(".video-ads").appendChild(ov49);
  await sleep(2200);
  check("49 ad-created + branding + overlay (khong badge) -> nhan dien QC",
    v.playbackRate === 16 && v.muted === true && v.style.opacity === "0",
    `rate=${v.playbackRate} muted=${v.muted} opacity="${v.style.opacity}"`);
  mp.classList.remove("ad-created");
  mp.classList.remove("ytp-branding-shown");
  ov49.remove();
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(900);
  check("49b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted && v.style.opacity !== "0",
    `rate=${v.playbackRate} muted=${v.muted} opacity="${v.style.opacity}"`);

  // 50. player.skipAd() phải được gọi khi vào QC (bỏ qua tức thì, không cần nút "Bỏ qua").
  // Đồng thời phải CÓ giới hạn tần suất để không treo trình duyệt.
  let apiCalls = 0;
  mp.skipAd = () => { apiCalls++; };
  v.duration = 15; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge50 = addBadge(mp);
  await sleep(1000);
  check("50 vao QC -> goi player.skipAd() ngay", apiCalls > 0, `calls=${apiCalls}`);
  mp.classList.remove("ad-showing"); badge50.remove();
  delete mp.skipAd;
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("50b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 51. Giới hạn tần suất gọi skipAd(): không spam (tránh treo trình duyệt)
  let apiCalls51 = 0;
  mp.skipAd = () => { apiCalls51++; };
  v.duration = 20; v.currentTime = 1; v.playbackRate = 1; v.muted = false;
  mp.classList.add("ad-showing");
  const badge51 = addBadge(mp);
  await sleep(5000);
  check("51 skipAd() co gioi han tan suat (khong spam)", apiCalls51 <= 5, `calls=${apiCalls51}`);
  mp.classList.remove("ad-showing"); badge51.remove();
  delete mp.skipAd;
  v.duration = 400; v.currentTime = 0; v.muted = false;
  await sleep(700);
  check("51b het QC -> khoi phuc", v.playbackRate === 1 && !v.muted, `rate=${v.playbackRate} muted=${v.muted}`);

  // 52. Diagnostics phải có nhóm "net" (lớp chặn tầng mạng) để chẩn đoán
  let diagToken = null;
  const onTok = (e) => { if (e.data && e.data.type === "FG_TOKEN_READY") diagToken = e.data.token; };
  window.addEventListener("message", onTok);
  window.postMessage({ type: "FG_TOKEN_REQUEST" }, "*");
  await sleep(200);
  window.removeEventListener("message", onTok);
  const diag = await new Promise((resolve) => {
    const id = Math.random().toString(36).slice(2);
    const onRes = (e) => {
      if (e.source !== window || !e.data || e.data.type !== "FG_DIAG_RES" || e.data.id !== id) return;
      window.removeEventListener("message", onRes);
      resolve(e.data.data);
    };
    window.addEventListener("message", onRes);
    window.postMessage({ type: "FG_DIAG_REQ", token: diagToken, id }, "*");
    setTimeout(() => resolve(null), 1200);
  });
  check("52 diagnostics co nhom 'net'", !!diag && Object.prototype.hasOwnProperty.call(diag, "net"),
    diag ? JSON.stringify(diag.net) : "null");

  // 53. RÒ RỈ BỘ NHỚ: player bị YouTube gỡ khỏi DOM phải được giải phóng hoàn toàn.
  //     MutationObserver giữ tham chiếu mạnh tới player → nếu không disconnect,
  //     mỗi lần SPA thay player sẽ giữ lại player cũ (+ cây con) vĩnh viễn.
  const M53 = window.__FG_TEST__ && window.__FG_TEST__.main;
  check("53 hook theo doi player co san", !!(M53 && typeof M53.getTracked === "function"),
    M53 && typeof M53.getTracked === "function" ? "OK" : "thieu getTracked");
  if (M53 && M53.getTracked) {
    const before53 = M53.getTracked();
    check("53b co player dang duoc theo doi", before53.players >= 1 && before53.observers >= 1,
      JSON.stringify(before53));

    // Tạo player giả rồi gỡ khỏi DOM ngay
    const ghost = document.createElement("div");
    ghost.className = "html5-video-player";
    ghost.id = "fg-ghost-player";
    document.body.appendChild(ghost);
    await sleep(400);
    const during53 = M53.getTracked();
    check("53c player gia duoc theo doi", during53.players >= before53.players + 1, JSON.stringify(during53));

    ghost.remove();
    await sleep(700);
    const after53 = M53.getTracked();
    check("53d player bi go khoi DOM -> duoc giai phong",
      after53.players === before53.players && after53.observers === before53.observers,
      `before=${JSON.stringify(before53)} after=${JSON.stringify(after53)}`);
  }

  document.getElementById("out").textContent = results.join("\n");
 } catch (e) {
   results.push("FAIL exception: " + (e && e.message ? e.message : e));
   document.getElementById("out").textContent = results.join("\n");
 }
})();
</script>
</body></html>
